spring:
  config:
    # Support launches from either the repository root or backend/. OS
    # environment variables still take precedence over imported values.
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
  attachments:
    max-file-size-bytes: ${MAX_FILE_SIZE_BYTES:10485760}
  ai:
    mock-enabled: ${AI_MOCK_ENABLED:true}
    analysis:
      provider: ${AI_ANALYSIS_PROVIDER:mock}
      model: ${AI_ANALYSIS_MODEL:}
      base-url: ${AI_ANALYSIS_BASE_URL:}
      api-key: ${AI_ANALYSIS_API_KEY:}
      timeout-ms: ${AI_ANALYSIS_TIMEOUT_MS:30000}

